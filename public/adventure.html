<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Dip Duck — The Calm Feathers</title>
  <meta name="theme-color" content="#10101c">
  <link rel="icon" href="favicon-48.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #10101c; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    canvas { width: min(100vw, 133vh); height: auto; display: block; touch-action: none; image-rendering: pixelated; }
    a.back { position: fixed; top: 10px; left: 12px; color: #ffd23f; font: 700 14px "Nunito", sans-serif; text-decoration: none; z-index: 2; }
    #pad { display: none; width: min(100vw, 520px); justify-content: space-between; align-items: center; padding: 0 18px; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
    .dpad button, .act, .menu { border: 0; border-radius: 10px; background: #2b2b45; color: #ffd23f; font: 800 20px "Nunito", sans-serif; touch-action: none; }
    .dpad button:active, .menu:active { background: #5a5a7a; }
    .up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; } .down { grid-column: 2; grid-row: 3; }
    .menu { padding: 10px 12px; font: 9px "Press Start 2P", monospace; }
    .act { width: 84px; height: 84px; border-radius: 50%; background: #ffd23f; color: #10101c; font: 11px "Press Start 2P", monospace; }
    .act:active { background: #ff8c1a; }
    @media (pointer: coarse) {
      body { justify-content: flex-start; padding-top: 44px; }
      canvas { width: min(100vw, 70vh * 1.333); }
      #pad { display: flex; }
    }
  </style>
</head>
<body>
  <a class="back" href="./">← Dip Duck</a>
  <canvas id="adv-canvas" aria-label="Dip Duck — The Calm Feathers"></canvas>
  <div id="pad">
    <div class="dpad">
      <button class="up" data-dir="up" aria-label="Up">▲</button>
      <button class="left" data-dir="left" aria-label="Left">◀</button>
      <button class="right" data-dir="right" aria-label="Right">▶</button>
      <button class="down" data-dir="down" aria-label="Down">▼</button>
    </div>
    <button class="menu" id="menu" aria-label="Menu">MENU</button>
    <button class="act" id="act" aria-label="Quack">QUACK</button>
  </div>
  <script src="adventure-data.js?v=20261103c"></script>
  <script src="adventure.js?v=20261103c"></script>
</body>
</html>
