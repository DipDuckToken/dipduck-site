<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#0B1524">
  <link rel="icon" href="favicon-48.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b1524; color: #f5f7fa; font: 700 16px "Nunito", sans-serif; }

    canvas { width: min(100vw, 100vh); height: auto; display: block; }

    body.render p { display: none; }

  <p id="msg"></p>

  <script src="i18n.js?v=20261101a"></script>
