# Publie le dossier public/ sur GitHub Pages.
# - À chaque push sur main.
# - Chaque jour à 6 h UTC : cours ETH de la veille (suivi fiscal) ; le 1er du mois, la
#   courbe du jeu reçoit en plus le mois qui vient de se terminer.
# - Pendant le mint NFT, décommente la ligne « toutes les heures » : images des nouvelles cartes.
# Dépôt public : les minutes d'Actions sont gratuites et illimitées.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
    # - cron: "0 * * * *" # toutes les heures, pendant le mint NFT
  workflow_dispatch: {}

# Droits minimaux : le build (qui lit des données externes) ne peut pas publier ;
# seul le job deploy reçoit le droit d'écrire sur Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Historique du Bitcoin et cours ETH (USD, CAD) : si une source ne répond pas, on garde la version du dépôt.
      - name: Mettre à jour les données
        run: |
          python tools/make-btc-history.py || echo "Historique du Bitcoin non mis à jour, version du dépôt conservée."
          python tools/make-price-history.py || echo "Cours ETH non mis à jour, version du dépôt conservée."

      # Images des cartes NFT révélées, gardées d'une exécution à l'autre (rien à faire avant le déploiement des NFT).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/nft
          key: nft-images-${{ github.run_id }}
          restore-keys: nft-images-

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Dessiner les images des cartes NFT
        run: |
          if grep -qE 'contract: "0x[0-9a-fA-F]{40}"' public/nft.js; then
            npm install --no-save playwright@1.56.1
            npx playwright install --with-deps chromium
            node tools/render-nft-images.mjs
          else
            echo "Pas de contrat NFT dans public/nft.js : rien à dessiner."
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
